services:
  - type: web
    name: weathergpt
    env: python
    plan: free
    region: oregon
    branch: main
    rootDir: weathergpt-backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: OPEN_METEO_API_KEY
        sync: false
